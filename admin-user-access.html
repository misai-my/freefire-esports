<!DOCTYPE html>
<html lang="en" class="ff-access-pending">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Access Control - Free Fire Caster</title>
  <link rel="icon" href="favicon.ico?v=20260620" sizes="any" />
  <link rel="icon" type="image/png" sizes="96x96" href="favicon.png?v=20260620" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=20260620" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/app-config.js"></script>
  <script src="assets/js/access-control.js?v=20260801-profile-access-v1"></script>
  <link rel="stylesheet" href="assets/css/readability-theme.css?v=20260629" />
  <style>
    :root{--bg:#0b1020;--panel:#121a2d;--panel2:#18223a;--ink:#eef3ff;--muted:#94a3b8;--brand:#ffbd59;--line:rgba(255,255,255,.12)}
    html[data-theme="light"]{--bg:#f5f7fb;--panel:#fff;--panel2:#f1f5f9;--ink:#111827;--muted:#64748b;--line:rgba(15,23,42,.12)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh;}
    .app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}.main{padding:28px;min-width:0}.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 18px 60px rgba(0,0,0,.18);margin-bottom:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}h1{margin:0;color:var(--brand);font-size:1.55rem}p{color:var(--muted);line-height:1.5}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.field{display:grid;gap:6px;min-width:180px}.field label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:900}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.06);color:var(--ink);padding:10px 12px;font:inherit}textarea{min-height:92px;resize:vertical}button,.btn{border:0;border-radius:999px;background:var(--brand);color:#111827;font-weight:900;padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}.btn-secondary{background:rgba(255,255,255,.08);color:var(--ink);border:1px solid var(--line)}.btn-danger{background:#ef4444;color:#fff}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}tr:hover td{background:rgba(255,189,89,.05)}.pill{display:inline-flex;align-items:center;border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:999px;padding:4px 8px;margin:2px;font-size:.78rem}.page-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:320px;overflow:auto;padding:10px;border:1px solid var(--line);border-radius:16px}.check{display:flex;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.035)}.check input{width:auto}.status{font-size:.9rem;color:var(--muted)}@media(max-width:980px){.app{display:block}.main{padding:18px}.grid{grid-template-columns:1fr}.page-list{grid-template-columns:1fr}} 
  </style>
</head>
<body>
  <div class="app">
    <aside id="sidebar"></aside>
    <main class="main">
      <section class="card top">
        <div>
          <h1>User Access Control</h1>
          <p>Manage which pages each logged-in user can open. This reads and updates the Supabase <strong>profiles</strong> table.</p>
        </div>
        <div class="controls">
          <button id="refreshBtn" type="button">Refresh users</button>
          <a class="btn btn-secondary" href="home.html">Back to dashboard</a>
        </div>
      </section>

      <section class="grid">
        <div class="card">
          <div class="controls" style="justify-content:space-between;margin-bottom:12px">
            <div class="field"><label>Search</label><input id="searchInput" placeholder="Email, name, role…" /></div>
            <div class="status" id="userCount">Loading…</div>
          </div>
          <div class="table-wrap"><table><thead><tr><th>User</th><th>Role</th><th>Pages</th><th>Status</th><th></th></tr></thead><tbody id="usersBody"></tbody></table></div>
        </div>

        <form class="card" id="editForm">
          <h2 style="margin-top:0">Profile access</h2>
          <input type="hidden" id="profileId" />
          <div class="field"><label>Email</label><input id="email" placeholder="user@email.com" /></div><br />
          <div class="field"><label>Display name</label><input id="displayName" placeholder="Display name" /></div><br />
          <div class="field"><label>Role preset</label><select id="role"><option>viewer</option><option>caster</option><option>analyst</option><option>producer</option><option>data</option><option>manager</option><option>admin</option><option>owner</option><option>none</option></select></div><br />
          <label class="check"><input type="checkbox" id="isActive" checked /> Active user</label>
          <label class="check"><input type="checkbox" id="accessAll" /> Access all pages</label>
          <p class="status">Checked pages below override the role preset. Leave all unchecked to use the role preset.</p>
          <div class="page-list" id="pageList"></div>
          <br />
          <div class="field"><label>Blocked pages</label><textarea id="blockedPages" placeholder="Optional. One page per line or comma-separated."></textarea></div>
          <br />
          <div class="controls">
            <button type="submit">Save access</button>
            <button class="btn-secondary" type="button" id="newBtn">New / clear</button>
          </div>
          <p class="status" id="formStatus"></p>
        </form>
      </section>
    </main>
  </div>
  <script>
    const client = window.__FF_SUPABASE_CLIENT || supabase.createClient(window.FF_CONFIG.SUPABASE_URL, window.FF_CONFIG.SUPABASE_ANON_KEY);
    window.__FF_SUPABASE_CLIENT = client;
    const PAGE_META = window.FF_ACCESS_PAGE_META || window.FF_ACCESS?.pageMeta || {};
    const pageList = document.getElementById('pageList');
    const usersBody = document.getElementById('usersBody');
    const statusEl = document.getElementById('formStatus');
    let profiles = [];

    function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function list(v){ if(Array.isArray(v)) return v; if(!v) return []; try{return JSON.parse(v)}catch(e){} return String(v).split(/[\n,;|]+/).map(x=>x.trim()).filter(Boolean); }
    function selectedPages(){ return [...pageList.querySelectorAll('input[type="checkbox"]:checked')].map(x=>x.value); }
    function renderPageChecks(selected=[]){
      const sel = new Set((selected||[]).map(x => String(x).toLowerCase()));
      pageList.innerHTML = Object.entries(PAGE_META).filter(([p])=>p!=='index.html').map(([page,meta]) => `<label class="check"><input type="checkbox" value="${esc(page)}" ${sel.has(page)?'checked':''}/> <span>${esc(meta.title || page)}<br><small class="status">${esc(page)}</small></span></label>`).join('');
    }
    function clearForm(){
      document.getElementById('profileId').value=''; document.getElementById('email').value=''; document.getElementById('displayName').value=''; document.getElementById('role').value='viewer'; document.getElementById('isActive').checked=true; document.getElementById('accessAll').checked=false; document.getElementById('blockedPages').value=''; renderPageChecks([]); statusEl.textContent='';
    }
    function editProfile(row){
      document.getElementById('profileId').value=row.id||'';
      document.getElementById('email').value=row.email||'';
      document.getElementById('displayName').value=row.display_name||row.full_name||'';
      document.getElementById('role').value=row.role||'viewer';
      document.getElementById('isActive').checked=row.is_active!==false;
      document.getElementById('accessAll').checked=row.access_all===true;
      document.getElementById('blockedPages').value=list(row.blocked_pages).join('\n');
      renderPageChecks(list(row.page_access || row.allowed_pages));
      statusEl.textContent='Editing '+(row.email||row.id);
    }
    function renderUsers(){
      const q=(document.getElementById('searchInput').value||'').toLowerCase().trim();
      const rows=profiles.filter(p => !q || [p.email,p.display_name,p.role,list(p.page_access).join(' ')].join(' ').toLowerCase().includes(q));
      document.getElementById('userCount').textContent = rows.length + ' user(s)';
      usersBody.innerHTML = rows.map(row => {
        const pages=list(row.page_access); const blocked=list(row.blocked_pages);
        return `<tr><td><strong>${esc(row.display_name||row.email||row.id)}</strong><br><small class="status">${esc(row.email||row.id)}</small></td><td><span class="pill">${esc(row.role||'viewer')}</span>${row.access_all?'<span class="pill">all</span>':''}</td><td>${pages.length?pages.slice(0,6).map(p=>`<span class="pill">${esc(p)}</span>`).join(''):'<span class="status">role preset</span>'}${blocked.length?'<br><span class="status">Blocked: '+esc(blocked.join(', '))+'</span>':''}</td><td>${row.is_active===false?'<span class="pill">inactive</span>':'<span class="pill">active</span>'}</td><td><button type="button" class="btn-secondary" data-edit="${esc(row.id)}">Edit</button></td></tr>`;
      }).join('') || '<tr><td colspan="5" class="status">No profiles found. Run supabase/12_user_access_profiles.sql first.</td></tr>';
    }
    async function loadUsers(){
      const { data, error } = await client.from(window.FF_CONFIG.ACCESS_PROFILE_TABLE || 'profiles').select('*').order('email', { ascending:true });
      if(error){ usersBody.innerHTML = `<tr><td colspan="5" class="status">${esc(error.message)}. Run supabase/12_user_access_profiles.sql and make your profile role admin/owner.</td></tr>`; return; }
      profiles = data || []; renderUsers();
    }
    usersBody.addEventListener('click', e => { const btn=e.target.closest('[data-edit]'); if(!btn) return; const row=profiles.find(p=>String(p.id)===String(btn.dataset.edit)); if(row) editProfile(row); });
    document.getElementById('searchInput').addEventListener('input', renderUsers);
    document.getElementById('refreshBtn').addEventListener('click', loadUsers);
    document.getElementById('newBtn').addEventListener('click', clearForm);
    document.getElementById('editForm').addEventListener('submit', async e => {
      e.preventDefault(); statusEl.textContent='Saving…';
      const id=document.getElementById('profileId').value.trim();
      const payload={ email:document.getElementById('email').value.trim(), display_name:document.getElementById('displayName').value.trim(), role:document.getElementById('role').value, is_active:document.getElementById('isActive').checked, access_all:document.getElementById('accessAll').checked, page_access:selectedPages(), blocked_pages:list(document.getElementById('blockedPages').value), updated_at:new Date().toISOString() };
      let error;
      if(id){ ({ error } = await client.from(window.FF_CONFIG.ACCESS_PROFILE_TABLE || 'profiles').update(payload).eq('id', id)); }
      else { ({ error } = await client.from(window.FF_CONFIG.ACCESS_PROFILE_TABLE || 'profiles').insert(payload)); }
      if(error){ statusEl.textContent='Save failed: '+error.message; return; }
      statusEl.textContent='Saved.'; await loadUsers();
    });
    document.addEventListener('ff:access-ready', () => { if(!pageList.children.length) renderPageChecks([]); });
    renderPageChecks([]); loadUsers();
  </script>
  <script src="assets/js/shared-sidebar.js?v=20260801-profile-access-v1" defer></script>
  <script src="assets/js/sidebar-cleanup-guard.js?v=20260629-sidebar-clean-v2" defer></script>
</body>
</html>
