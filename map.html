<style>
    :root{
      --bg:#07090f;
      --bg2:#0b1020;
      --line: rgba(255,255,255,.10);
      --ink:#f4f6ff;
      --muted:#aab1c5;

      --brand:#ffbd59;
      --accent:#4dd3ff;

      --radius-lg: 18px;

    }

    *{ box-sizing:border-box; }
    html, body{
      margin:0; padding:0;
      width:100%; height:100vh; height:100dvh;
      overflow:hidden;
      font-family: Roboto, system-ui, -apple-system, Segoe UI, Arial;
      color: var(--ink);
      background:
        radial-gradient(900px 500px at 18% 12%, rgba(77,211,255,.15), transparent 60%),
        radial-gradient(700px 420px at 85% 18%, rgba(255,189,89,.12), transparent 60%),
        radial-gradient(900px 620px at 50% 110%, rgba(255,119,51,.10), transparent 60%),
        linear-gradient(180deg, var(--bg), var(--bg2));
      display:flex;
      align-items:center;
      justify-content:center;

      -webkit-touch-callout:none;
      -webkit-user-select:none;
      -webkit-tap-highlight-color: transparent;
      user-select:none;
    }

    #main{
      width: min(100%, 1440px);
      height: min(100%, 1060px);
      display:grid;
      grid-template-columns: minmax(0, 1fr) clamp(240px, 26vw, 320px);
      overflow:hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: rgba(0,0,0,.22);
    }

    #map-container{
      display:grid;
      grid-template-rows: auto minmax(0,1fr);
      min-width:0;
      min-height:0;
      background:#090e17;
    }

    #map-toolbar{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:6px;
      padding:6px 8px;
      border-bottom:1px solid var(--line);
    }

    #map-toolbar .select-wrap{ flex:1 1 110px; width:auto; min-height:40px; }
    .viewport-controls{ display:flex; align-items:center; gap:4px; }
    .route-tools{ display:flex; align-items:center; gap:8px; flex:1 0 100%; }
    #route-instructions{ margin:0; color:var(--muted); font-size:.76rem; }
    @media (max-width: 480px){
      .route-tools{ gap:6px; }
      #route-instructions{ font-size:.7rem; }
    }
    .viewport-controls button{
      min-width:40px;
      min-height:40px;
      padding:4px 8px;
      border:1px solid var(--line);
      border-radius:8px;
      background:#161e2c;
      color:var(--ink);
      font:inherit;
      font-size:.85rem;
      cursor:pointer;
      touch-action:manipulation;
    }

    .viewport-controls button[aria-pressed="true"]{ border-color:var(--brand); color:var(--brand); }
    .viewport-controls button:disabled{ opacity:.45; cursor:default; }
    #fit-map{ min-width:58px; font-variant-numeric: tabular-nums; }

    #map-viewport{
      display:grid;
      place-items:center;
      overflow:hidden;
      container-type:size;
      touch-action:none;
      position:relative;
    }

    #map{
      width:min(100cqw, 99cqh);
      aspect-ratio:792 / 800;
      position:relative;
      transform-origin:top left;
      touch-action:none;
      background-size:100% 100%;
      background-position:center;
      background-repeat:no-repeat;
    }

    #map[data-trace="true"]{ cursor:crosshair; }
    #map[data-pan="true"]{ cursor:grab; }
    #map[data-pan="true"]:active{ cursor:grabbing; }

    #maskCanvas, #pathCanvas{
      position:absolute;
      top:0; left:0;
      width:100%;
      height:100%;
      pointer-events:none;
    }
    #maskCanvas{ z-index: 9; }
    #pathCanvas{ z-index: 10; }

    /* Sidebar */
    #sidebar{
      min-width:0;
      min-height:0;
      display:flex;
      flex-direction:column;
      padding: 12px;
      background: rgba(14, 18, 28, .70);
      border-left: 1px solid rgba(255,255,255,.06);
      overflow:auto;
      overscroll-behavior:contain;
    }

    .roster-heading{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      margin-bottom:6px;
    }
    .roster-heading h2{ margin:0; font-size:.85rem; }
    #edit-team-logo, .logo-actions button{
      min-height:38px;
      padding:5px 10px;
      border:1px solid var(--line);
      border-radius:8px;
      background:#161e2c;
      color:var(--ink);
      font:inherit;
      font-size:.82rem;
      cursor:pointer;
    }
    .logo-actions button[type="submit"]{
      background:var(--brand);
      color:#111522;
      font-weight:700;
    }
    .logo-actions button:disabled{ opacity:.55; cursor:default; }
    #team-logo-dialog{
      width:min(400px, calc(100% - 24px));
      max-height:calc(100dvh - 24px);
      padding:16px;
      border:1px solid var(--line);
      border-radius:14px;
      background:#141c2a;
      color:var(--ink);
      overflow:auto;
    }
    #team-logo-dialog::backdrop{ background:rgba(0,0,0,.65); }
    #team-logo-dialog h2{ margin:0 0 14px; font-size:1.05rem; }
    #team-logo-form{ display:grid; gap:10px; }
    #team-logo-form label{ display:grid; gap:5px; font-size:.83rem; }
    #team-logo-form input, #team-logo-form select{
      width:100%;
      min-height:40px;
      padding:6px 9px;
      border:1px solid var(--line);
      border-radius:8px;
      background:#090e17;
      color:var(--ink);
      font:inherit;
      font-size:16px;
      user-select:text;
    }
    #team-logo-formats{ margin:0; color:var(--muted); font-size:.8rem; }
    .logo-preview{
      display:flex;
      align-items:center;
      gap:10px;
      min-height:56px;
      margin:0;
      color:var(--muted);
      font-size:.8rem;
    }
    #team-logo-preview{ width:56px; height:56px; object-fit:contain; border-radius:8px; }
    .logo-actions{ display:flex; justify-content:flex-end; gap:8px; }

    /* Team icons */
    .icon-grid{
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      justify-items:center;
      padding: 8px;
      border-radius: 14px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.10);
      margin-bottom: 10px;
      user-select:none;
    }

    .team-icon{
      width: 44px;
      height: 44px;
      border-radius: 12px;
      cursor:pointer;
      background: rgba(0,0,0,.18);
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: 0 10px 24px rgba(0,0,0,.35);
      object-fit: contain;
    }
    .team-pick{
      display:grid;
      justify-items:center;
      gap:4px;
      min-width:0;
      padding:2px;
      border:0;
      background:none;
      color:var(--ink);
      cursor:pointer;
      touch-action:pan-x;
    }
    .team-tag{
      max-width:100%;
      overflow:hidden;
      text-overflow:ellipsis;
      font-size:.68rem;
      font-weight:700;
      white-space:nowrap;
    }
    .team-color{ width:24px; height:3px; border-radius:4px; background:var(--team-color); }
    .team-pick[aria-pressed="true"] .team-icon{
      outline: 2px solid rgba(255,189,89,.55);
      outline-offset: 2px;
      box-shadow: 0 0 0 3px rgba(255,189,89,.12);
    }

    /* Controls */
    #controls{
      display:flex;
      flex-direction:column;
      gap: 8px;
    }
    button:focus-visible, .select-wrap:focus-within{
      outline:2px solid var(--accent);
      outline-offset:2px;
    }
    #planner-status{ margin:0; min-height:1.2em; font-size:.78rem; color:var(--muted); }

    #controls button{
      width: 100%;
      padding: 10px 10px;
      font-weight: 900;
      font-size: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.22);
      color: rgba(244,246,255,.90);
      cursor:pointer;
      transition: .18s ease;
    }

    .button-row{ display:flex; gap: 8px; }
    .button-row button{ flex:1; min-width:0; }

    #realtime-toggle-btn{ border-color: rgba(77,211,255,.28); }
    #realtime-toggle-btn.active{
      background: rgba(77,211,255,.18);
      border-color: rgba(77,211,255,.40);
      box-shadow: 0 0 0 3px rgba(77,211,255,.10);
    }

    #draw-circle.active{
      background: rgba(0,255,255,.18);
      border-color: rgba(0,255,255,.42);
      box-shadow: 0 0 0 3px rgba(0,255,255,.10);
    }

    #note-mode.active{
      background: rgba(255,189,89,.14);
      border-color: rgba(255,189,89,.40);
      box-shadow: 0 0 0 3px rgba(255,189,89,.10);
    }

    #import-file{ display:none; }

    /* ✅ Custom visible map selector (fix selected text invisible on mobile) */
    .select-wrap{
      position:relative;
      width:100%;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.10);
      background: #0e111a;
      padding: 10px 12px;
      font-weight: 900;
      font-size: 12px;
      color: rgba(244,246,255,.92);
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .select-wrap::after{
      content:"▾";
      color: rgba(244,246,255,.75);
      font-weight: 900;
      margin-left: 10px;
      flex:0 0 auto;
    }
    #map-select-label{
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      padding-right: 10px;
    }
    /* Native select stays functional but invisible */
    #map-select{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      opacity:0;
      appearance:none;
      -webkit-appearance:none;
      cursor:pointer;
    }

    /* Unit */
    .unit{
      position:absolute;
      width:30px; height:30px;
      background: rgba(255,255,255,.10);
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      z-index: 20;
      touch-action:none;
    }
    .unit img{
      width:100%; height:100%;
      border-radius:999px;
      box-shadow: 0 0 12px 2px rgba(255,255,255,0.35);
      border: 1px solid rgba(255,255,255,.22);
      background: rgba(0,0,0,.35);
      display:block;
      pointer-events:none;
    }
    .unit-label{
      position:absolute;
      top:-18px; left:50%;
      transform: translateX(-50%);
      font-size: 12px;
      font-weight: 900;
      background: rgba(0,0,0,.55);
      color: rgba(244,246,255,.92);
      padding: 2px 6px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.10);
      white-space:nowrap;
      pointer-events:none;
    }
    .reset-btn{
      position:absolute;
      bottom:-20px; left:50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,.92);
      color:#000;
      font-size: 10px;
      font-weight: 900;
      padding: 2px 6px;
      border: none;
      border-radius: 8px;
      cursor:pointer;
      touch-action:none;
    }

    /* Notes */
    .note{
      position:absolute;
      background: rgba(255,255,255,.92);
      color: #000;
      border: 1px solid rgba(0,0,0,.28);
      border-radius: 10px;
      max-width: 220px;
      overflow:hidden;
      box-shadow: 0 14px 40px rgba(0,0,0,.45);
      user-select: text;
      z-index: 30;
    }
    .drag-handle{
      background: rgba(0,0,0,.12);
      padding: 4px 8px;
      font-weight: 1000;
      cursor: grab;
      user-select:none;
      touch-action:none;
    }
    .note div[contenteditable]{
      padding: 6px 8px;
      min-height: 20px;
      outline:none;
      font-size: 12px;
      line-height: 1.2rem;
    }

    #user-info{
      font-size: .78rem;
      text-align:center;
      margin-top: 10px;
      color: rgba(170,177,197,.85);
      user-select:text;
    }

    @media (max-width: 820px) and (orientation: portrait){
      #main{
        grid-template-columns:minmax(0, 1fr);
        grid-template-rows:minmax(0, 1fr) clamp(158px, 27dvh, 220px);
        border:0;
        border-radius:0;
      }
      #sidebar{ padding:8px; border-left:0; border-top:1px solid var(--line); }
      .icon-grid{
        display:flex;
        gap:10px;
        overflow-x:auto;
        overflow-y:hidden;
        touch-action:pan-x;
      }
      .team-pick{ flex:0 0 48px; }
    }

    @media (max-height: 550px) and (orientation: landscape){
      #main{ grid-template-columns:minmax(0, 1fr) minmax(180px, 30%); border-radius:0; }
      #sidebar{ padding:8px; }
      .icon-grid{ grid-template-columns:repeat(3, 1fr); }
      .team-icon{ width:36px; height:36px; }
    }
  </style>

  <script>
    /***********************
     * Supabase
     ***********************/
    const client = supabase.createClient(
      (window.FF_CONFIG && window.FF_CONFIG.SUPABASE_URL) || 'https://ooutjrewmwsixghbouxi.supabase.co',
      (window.FF_CONFIG && window.FF_CONFIG.SUPABASE_ANON_KEY) || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9vdXRqcmV3bXdzaXhnaGJvdXhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcwMjg3NTMsImV4cCI6MjA4MjYwNDc1M30.13WkdGiQH39lZH3iDgVDd_tZrHlI0twhGeiZNdwaMSg'
    );

    async function ensureSession(){
      const { data: { session } } = await client.auth.getSession();
      if (!session) { window.location.href = "index.html"; return null; }
      return session;
    }
    async function logout(){
      await client.auth.signOut();
      window.location.href = "index.html";
    }
    document.getElementById("logoutBtn").addEventListener("click", logout);

    /***********************
     * Map selector label (fix selected text invisible)
     ***********************/
    const mapSelect = document.getElementById("map-select");
    const mapSelectLabel = document.getElementById("map-select-label");

    function updateMapLabel(){
      const opt = mapSelect.options[mapSelect.selectedIndex];
      mapSelectLabel.textContent = opt ? opt.textContent : "Select map";
    }

    /***********************
     * LOGICAL COORDINATES (perfect sync across devices)
     ***********************/
    const LOGICAL_W = 792;
    const LOGICAL_H = 800;

    const map = document.getElementById("map");
    const mapViewport = document.getElementById("map-viewport");
    const plannerStatus = document.getElementById("planner-status");

    const pathCanvas = document.getElementById("pathCanvas");
    const ctx = pathCanvas.getContext("2d");

    const maskCanvas = document.getElementById("maskCanvas");
    const ctxMask = maskCanvas.getContext("2d");

    function setMapBg(){ map.style.backgroundImage = `url('${mapSelect.value}')`; }

    function clientToLogical(e){
      const rect = map.getBoundingClientRect();
      return {
        x: ((e.clientX - rect.left) / rect.width) * LOGICAL_W,
        y: ((e.clientY - rect.top) / rect.height) * LOGICAL_H
      };
    }

    function logicalToPx(p){
      return {
        x: (p.x / LOGICAL_W) * map.clientWidth,
        y: (p.y / LOGICAL_H) * map.clientHeight
      };
    }

    function scaleFactors(){
      return {
        sx: map.clientWidth / LOGICAL_W,
        sy: map.clientHeight / LOGICAL_H,
        s: Math.min(map.clientWidth / LOGICAL_W, map.clientHeight / LOGICAL_H)
      };
    }

    /***********************
     * State
     ***********************/
    const teamPaths = {};     // logical points
    const teamIcons = {};     // Map markers
    const teamChoices = new Map();
    const TEAM_TABLE = "teams_pathplanner";
    const circles = [];       // logical
    const notesData = [];     // logical

    const historyStack = [];
    let selectedIcon = null;
    let activeTeam = null;

    let drawCircleMode = false;
    let noteMode = false;

    const DRAG_THRESHOLD_PX = 8;

    const teamColors = [
      "#FF0000", "#00FF00", "#00FFFF", "#FFFF00", "#FF00FF", "#FFA500",
      "#00BFFF", "#FF69B4", "#7FFF00", "#FF4500", "#00FF7F", "#1E90FF",
      "#FFD700", "#ADFF2F", "#FF1493", "#40E0D0", "#FF6347", "#87CEEB"
    ];

    function teamIndex(id){
      const n = parseInt(String(id).replace("team",""), 10);
      return Number.isFinite(n) ? (n-1) : 0;
    }

    /***********************
     * Resize canvases
     ***********************/
    function repositionOverlays(){
      for (const id in teamIcons){
        const el = teamIcons[id];
        const first = teamPaths[id]?.[0];
        if (!el || !first) continue;
        const p = logicalToPx(first);
        el.style.left = `${p.x - 15}px`;
        el.style.top  = `${p.y - 15}px`;
      }
      map.querySelectorAll(".note").forEach(noteEl => {
        const id = noteEl.dataset.noteId;
        const n = notesData.find(x => x.id === id);
        if (!n) return;
        const p = logicalToPx(n);
        noteEl.style.left = `${p.x}px`;
        noteEl.style.top  = `${p.y}px`;
      });
    }

    function resizeCanvases(){
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const width = Math.round(map.clientWidth * dpr);
      const height = Math.round(map.clientHeight * dpr);
      if (!width || !height || (pathCanvas.width === width && pathCanvas.height === height &&
          pathCanvas.dataset.initialized)) return;

      for (const canvas of [pathCanvas, maskCanvas]){
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").setTransform(width / map.clientWidth, 0, 0, height / map.clientHeight, 0, 0);
      }
      pathCanvas.dataset.initialized = "true";
      updateView();
      repositionOverlays();
      queueDraw();
    }

    let drawFrame = 0;
    function queueDraw(){
      if (drawFrame) return;
      drawFrame = requestAnimationFrame(() => {
        drawFrame = 0;
        drawAll();
        maskCanvas.hidden = mapSelect.selectedOptions[0]?.dataset.mode !== "CS";
        if (!maskCanvas.hidden) drawOverlayMask(circles);
      });
    }

    /***********************
     * Draw
     ***********************/
    function drawRoute(path, color, sx, sy, hasTeamIcon){
      if (!path.length) return;
      ctx.beginPath();
      for (let i = 0; i < path.length; i++){
        const point = path[i];
        const previous = path[i - 1];
        const x = point.x * sx;
        const y = point.y * sy;
        if (!previous || point.breakBefore){
          ctx.moveTo(x, y);
          continue;
        }
        ctx.lineTo(x, y);
        if (!path[i + 1] || path[i + 1].breakBefore){
          const dx = x - previous.x * sx;
          const dy = y - previous.y * sy;
          const angle = Math.atan2(dy, dx);
          const arrowLength = Math.min(13, Math.hypot(dx, dy) * .85);
          ctx.moveTo(x - arrowLength * Math.cos(angle - Math.PI / 6), y - arrowLength * Math.sin(angle - Math.PI / 6));
          ctx.lineTo(x, y);
          ctx.lineTo(x - arrowLength * Math.cos(angle + Math.PI / 6), y - arrowLength * Math.sin(angle + Math.PI / 6));
        }
      }
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.strokeStyle = "rgba(0,0,0,.84)";
      ctx.lineWidth = 7;
      ctx.stroke();
      ctx.strokeStyle = color;
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "bold 10px Roboto, system-ui, sans-serif";
      let number = 0;
      for (let i = 0; i < path.length; i++){
        const point = path[i];
        const next = path[i + 1];
        if (point.trace && i !== 0 && !point.breakBefore && next?.trace && !next.breakBefore) continue;

        const inset = hasTeamIcon && i === 0 ? (point.x * sx + 24 > map.clientWidth ? -24 : 24) : 0;
        const x = Math.max(10, Math.min(map.clientWidth - 10, point.x * sx + inset));
        const y = Math.max(10, Math.min(map.clientHeight - 10, point.y * sy + (point.trace || i === path.length - 1 ? -12 : 0)));
        ctx.beginPath();
        ctx.arc(x, y, 9, 0, 2 * Math.PI);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = "#07090f";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = "#07090f";
        ctx.fillText(String(++number), x, y);
      }
      ctx.restore();
    }

    function drawAll(){
      ctx.clearRect(0, 0, map.clientWidth, map.clientHeight);

      const { sx, sy, s } = scaleFactors();

      for (const c of circles){
        const cx = c.x * sx, cy = c.y * sy;
        const r  = c.r * s;

        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, 2*Math.PI);
        ctx.strokeStyle = c.color || "#00ffff";
        ctx.setLineDash([3,1]);
        ctx.lineWidth = 5;
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.beginPath();
        ctx.arc(cx + r, cy, 4, 0, 2*Math.PI);
        ctx.fillStyle = c.color || "#00ffff";
        ctx.fill();
      }

      const draft = gesture?.trace;
      for (const id in teamPaths){
        const path = draft?.team === id ? teamPaths[id].concat(draft.points) : teamPaths[id];
        drawRoute(path, teamColors[teamIndex(id)] || "#fff", sx, sy, Boolean(teamIcons[id]));
      }
      if (draft && !teamPaths[draft.team]){
        drawRoute(draft.points, teamColors[teamIndex(draft.team)] || "#fff", sx, sy, false);
      }
    }

    function drawOverlayMask(circlesToReveal){
      ctxMask.clearRect(0,0,map.clientWidth,map.clientHeight);

      ctxMask.fillStyle = "rgba(0,0,0,0.75)";
      ctxMask.fillRect(0,0,map.clientWidth,map.clientHeight);

      const { sx, sy, s } = scaleFactors();
      ctxMask.globalCompositeOperation = "destination-out";
      circlesToReveal.forEach(c => {
        ctxMask.beginPath();
        ctxMask.arc(c.x*sx, c.y*sy, c.r*s, 0, 2*Math.PI);
        ctxMask.fill();
      });
      ctxMask.globalCompositeOperation = "source-over";
    }

    /***********************
     * Circles hit tests (logical)
     ***********************/
    function findCircleResize(ptL){
      for (let i = circles.length - 1; i >= 0; i--){
        const c = circles[i];
        const dist = Math.hypot(c.x - ptL.x, c.y - ptL.y);
        if (Math.abs(dist - c.r) < 12) return c;
      }
      return null;
    }
    function findCircleDrag(ptL){
      for (let i = circles.length - 1; i >= 0; i--){
        const c = circles[i];
        const dist = Math.hypot(c.x - ptL.x, c.y - ptL.y);
        if (dist < c.r) return c;
      }
      return null;
    }

    /***********************
     * Notes
     ***********************/
    function createNote(logicalX, logicalY, text, forcedId, pushHistory=true){
      const id = forcedId || ("n_" + Math.random().toString(16).slice(2));

      const noteDiv = document.createElement("div");
      noteDiv.className = "note";
      noteDiv.dataset.noteId = id;

      const handle = document.createElement("div");
      handle.className = "drag-handle";
      handle.textContent = "☰";

      const content = document.createElement("div");
      content.contentEditable = true;
      content.textContent = text || "";

      noteDiv.appendChild(handle);
      noteDiv.appendChild(content);
      map.appendChild(noteDiv);

      if (!notesData.find(n => n.id === id)){
        notesData.push({ id, x: logicalX, y: logicalY, text: text || "" });
        if (pushHistory) historyStack.push({ type:"note", id });
      }

      const p = logicalToPx({ x: logicalX, y: logicalY });
      noteDiv.style.left = `${p.x}px`;
      noteDiv.style.top  = `${p.y}px`;

      content.addEventListener("input", () => {
        const nd = notesData.find(n => n.id === id);
        if (nd) nd.text = content.textContent || "";
        saveMapState(350);
      });
      content.addEventListener("blur", () => {
        if (saveTimer) saveMapState();
      });

      let drag = null;

      handle.addEventListener("pointerdown", (e) => {
        if (drag || e.button !== 0) return;
        const note = notesData.find(n => n.id === id);
        if (!note) return;
        e.preventDefault();
        e.stopPropagation();
        handle.setPointerCapture(e.pointerId);

        const point = clientToLogical(e);
        drag = { id: e.pointerId, offsetX: point.x - note.x, offsetY: point.y - note.y, note };
      });

      handle.addEventListener("pointermove", (e) => {
        if (drag?.id !== e.pointerId) return;
        const point = clientToLogical(e);
        drag.note.x = Math.max(0, Math.min(LOGICAL_W, point.x - drag.offsetX));
        drag.note.y = Math.max(0, Math.min(LOGICAL_H, point.y - drag.offsetY));
        const position = logicalToPx(drag.note);
        noteDiv.style.left = `${position.x}px`;
        noteDiv.style.top = `${position.y}px`;
      });

      function finishDrag(e){
        if (drag?.id !== e.pointerId) return;
        drag = null;
        saveMapState();
      }
      handle.addEventListener("pointerup", finishDrag);
      handle.addEventListener("pointercancel", finishDrag);
      handle.addEventListener("lostpointercapture", finishDrag);

      return noteDiv;
    }

    /***********************
     * Units
     ***********************/
    function createUnit(iconEl, teamId, logicalX, logicalY){
      const div = document.createElement("div");
      div.className = "unit";

      const img = iconEl.querySelector("img").cloneNode(true);
      img.classList.remove("team-icon");
      img.loading = "eager";
      img.style.width = img.style.height = "30px";

      const label = document.createElement("div");
      label.className = "unit-label";
      label.textContent = iconEl.dataset.teamTag || teamId;

      const reset = document.createElement("button");
      reset.className = "reset-btn";
      reset.textContent = "Reset";
      reset.addEventListener("pointerdown", (e) => e.stopPropagation());
      reset.addEventListener("click", (e) => {
        e.stopPropagation();
        div.remove();
        delete teamPaths[teamId];
        delete teamIcons[teamId];
        if (activeTeam === teamId) setSelection(null);
        historyStack.splice(0, historyStack.length, ...historyStack.filter(action => action.team !== teamId));
        queueDraw();
        saveMapState();
      });

      div.append(img, label, reset);
      map.appendChild(div);

      div.addEventListener("pointerdown", (e) => {
        if (!traceMode) e.stopPropagation();
        setSelection(iconEl);
      });

      const p = logicalToPx({ x: logicalX, y: logicalY });
      div.style.left = `${p.x - 15}px`;
      div.style.top  = `${p.y - 15}px`;

      return div;
    }

      if (!supportedType || file.size > MAX_LOGO_BYTES){

    async function prepareLogoImage(){
      const { naturalWidth, naturalHeight } = logoPreview;
      if (!naturalWidth || !naturalHeight) throw new Error("Logo image is empty");
      const ratio = Math.min(1, MAX_LOGO_EDGE / Math.max(naturalWidth, naturalHeight));
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(naturalWidth * ratio));
      canvas.height = Math.max(1, Math.round(naturalHeight * ratio));
      canvas.getContext("2d").drawImage(logoPreview, 0, 0, canvas.width, canvas.height);
      const image = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
      if (!image) throw new Error("PNG conversion failed");
      return image;
    }

    async function linkUploadedLogo(storage, path, dbId){
      const { data:{ publicUrl } } = storage.getPublicUrl(path);
      const teams = client.from(TEAM_TABLE);
      let saveError;
      try {
        const result = await teams.update({ logo_url:publicUrl }).eq("id", dbId).select("logo_url").maybeSingle();
        if (!result.error && result.data?.logo_url === publicUrl) return publicUrl;
        saveError = result.error || new Error("No team was updated");
      } catch (error) {
        saveError = error;
      }

      // Check the row before removing a file after an ambiguous write failure.
      const current = await client.from(TEAM_TABLE).select("logo_url").eq("id", dbId).maybeSingle();
      if (!current.error && current.data?.logo_url === publicUrl) return publicUrl;
      if (!current.error){
        const { error } = await storage.remove([path]);
        if (error) console.error("Failed to remove an unused logo:", error);
      }
      throw saveError;
    }

        if (error) throw error;

    const drawCircleBtn = document.getElementById("draw-circle");
    const noteBtn = document.getElementById("note-mode");
    const panBtn = document.getElementById("pan-map");
    const waypointBtn = document.getElementById("waypoint-map");
    const traceBtn = document.getElementById("trace-map");
    const routeInstructions = document.getElementById("route-instructions");
    const zoomOut = document.getElementById("zoom-out");
    const zoomIn = document.getElementById("zoom-in");
    const fitMap = document.getElementById("fit-map");
    const view = { scale:1, x:0, y:0 };
    let panMode = false;
    let traceMode = false;
    let routeMode = "waypoint";

    function updateRouteInstructions(){
      if (panMode) routeInstructions.textContent = "Drag to pan. Pinch to zoom.";
      else if (drawCircleMode) routeInstructions.textContent = "Tap to add a circle.";
      else if (noteMode) routeInstructions.textContent = "Tap to place a note.";
      else if (!activeTeam) routeInstructions.textContent = "Select a team to plot its rotation.";
      else routeInstructions.textContent = traceMode ? "Drag to trace. Use two fingers to pan or zoom." : "Tap to add a numbered waypoint.";
    }

    function setMode(mode){
      if (mode === "trace" || mode === "waypoint") routeMode = mode;
      drawCircleMode = mode === "circle";
      noteMode = mode === "note";
      panMode = mode === "pan";
      traceMode = mode === "trace";
      for (const [button, pressed] of [
        [drawCircleBtn, drawCircleMode], [noteBtn, noteMode], [panBtn, panMode],
        [waypointBtn, mode === "waypoint"], [traceBtn, traceMode]
      ]){
        button.classList.toggle("active", pressed);
        button.setAttribute("aria-pressed", String(pressed));
      }
      map.dataset.pan = String(panMode);
      map.dataset.trace = String(traceMode);
      updateRouteInstructions();
    }

    drawCircleBtn.onclick = () => setMode(drawCircleMode ? routeMode : "circle");
    noteBtn.onclick = () => setMode(noteMode ? routeMode : "note");
    panBtn.onclick = () => setMode(panMode ? routeMode : "pan");
    waypointBtn.onclick = () => setMode("waypoint");
    traceBtn.onclick = () => setMode("trace");
    setMode(routeMode);

    function updateView(){
      view.x = Math.max(map.clientWidth * (1 - view.scale), Math.min(0, view.x));
      view.y = Math.max(map.clientHeight * (1 - view.scale), Math.min(0, view.y));
      map.style.transform = view.scale === 1 ? "" :
        `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
      fitMap.textContent = Math.round(view.scale * 100) + "%";
      zoomOut.disabled = view.scale === 1;
      zoomIn.disabled = view.scale === 4;
    }

    function zoomAt(scale, from, to = from){
      const rect = map.getBoundingClientRect();
      const nextScale = Math.max(1, Math.min(4, scale));
      const ratio = nextScale / view.scale;
      view.x += to.x - from.x + (from.x - rect.left) * (1 - ratio);
      view.y += to.y - from.y + (from.y - rect.top) * (1 - ratio);
      view.scale = nextScale;
      updateView();
    }

    function centerView(){
      const rect = mapViewport.getBoundingClientRect();
      return { x:rect.left + rect.width / 2, y:rect.top + rect.height / 2 };
    }

    zoomOut.onclick = () => zoomAt(view.scale / 1.25, centerView());
    zoomIn.onclick = () => zoomAt(view.scale * 1.25, centerView());
    fitMap.onclick = () => {
      Object.assign(view, { scale:1, x:0, y:0 });
      updateView();
    };
    mapViewport.addEventListener("wheel", (e) => {
      if (e.ctrlKey || e.metaKey || !e.deltaY) return;
      e.preventDefault();
      zoomAt(view.scale * (e.deltaY < 0 ? 1.12 : 1 / 1.12), { x:e.clientX, y:e.clientY });
    }, { passive:false });
    new ResizeObserver(resizeCanvases).observe(map);

    /***********************
     * Map pointer interactions
     ***********************/
    const pointers = new Map();
    let gesture = null;
    let pinching = false;

    function addRoutePoints(team, points){
      const path = teamPaths[team] ||= [];
      if (!path.length){
        const icon = teamChoices.get(team);
        if (icon) teamIcons[team] = createUnit(icon, team, points[0].x, points[0].y);
      }
      for (const point of points) path.push(point);
      historyStack.push({ type:"line", team, count:points.length });
      queueDraw();
      saveMapState();
    }

    function insideMap(point){
      return point.x >= 0 && point.x <= LOGICAL_W && point.y >= 0 && point.y <= LOGICAL_H;
    }

    function sampleTrace(trace, event, final = false){
      const point = clientToLogical(event);
      if (!insideMap(point)){
        trace.breakBefore = true;
        return;
      }

      const last = trace.points.at(-1);
      const minDistance = final ? 1 : 6;
      if (!trace.breakBefore && Math.hypot(point.x - last.x, point.y - last.y) < minDistance) return;

      trace.points.push({ ...point, trace:true, ...(trace.breakBefore ? { breakBefore:true } : {}) });
      trace.breakBefore = false;
    }

    function pointerPair(){
      const [a, b] = pointers.values();
      return { center:{ x:(a.x + b.x) / 2, y:(a.y + b.y) / 2 }, distance:Math.hypot(a.x - b.x, a.y - b.y) };
    }

    map.addEventListener("pointerdown", (e) => {
      if (e.button !== 0 || e.target.closest(".note, .reset-btn") || (!traceMode && e.target.closest(".unit"))) return;
      e.preventDefault();
      map.setPointerCapture(e.pointerId);
      const clientPoint = { x:e.clientX, y:e.clientY };
      pointers.set(e.pointerId, clientPoint);

      if (pointers.size > 1){
        if (gesture?.circle && gesture.moved){
          Object.assign(gesture.circle, gesture.original);
          queueDraw();
        }
        if (gesture?.trace) queueDraw();
        gesture = null;
        pinching = true;
        return;
      }

      const downPoint = clientToLogical(e);
      const canMoveCircle = !panMode && !traceMode;
      const resize = canMoveCircle ? findCircleResize(downPoint) : null;
      const circle = resize || (canMoveCircle ? findCircleDrag(downPoint) : null);
      gesture = { start:clientPoint, last:clientPoint, downPoint, circle, resize, original:circle && { ...circle } };
      if (traceMode && activeTeam && insideMap(downPoint)){
        gesture.trace = { team:activeTeam, points:[{ ...downPoint, trace:true, breakBefore:true }] };
      }
    });

    map.addEventListener("pointermove", (e) => {
      if (!pointers.has(e.pointerId)) return;
      e.preventDefault();
      const previousPair = pointers.size > 1 ? pointerPair() : null;
      const point = { x:e.clientX, y:e.clientY };
      pointers.set(e.pointerId, point);

      if (previousPair){
        const next = pointerPair();
        if (previousPair.distance > 0) zoomAt(view.scale * next.distance / previousPair.distance, previousPair.center, next.center);
        return;
      }

      if (!gesture) return;
      const { start, last, downPoint, circle, resize, original } = gesture;
      if (!gesture.moved && Math.hypot(point.x - start.x, point.y - start.y) <= DRAG_THRESHOLD_PX) return;
      gesture.moved = true;
      gesture.last = point;

      if (gesture.trace){
        sampleTrace(gesture.trace, e);
        queueDraw();
      } else if (circle){
        const logical = clientToLogical(e);
        if (resize){
          circle.r = Math.max(10, Math.hypot(logical.x - circle.x, logical.y - circle.y));
        } else {
          circle.x = Math.max(0, Math.min(LOGICAL_W, original.x + logical.x - downPoint.x));
          circle.y = Math.max(0, Math.min(LOGICAL_H, original.y + logical.y - downPoint.y));
        }
        queueDraw();
      } else if (view.scale > 1){
        view.x += point.x - last.x;
        view.y += point.y - last.y;
        updateView();
      }
    });

    function endPointer(e){
      if (!pointers.delete(e.pointerId)) return;
      if (pinching){
        if (pointers.size === 0){
          pinching = false;
          applyLatestRemote();
        }
        return;
      }
      const endedGesture = gesture;
      gesture = null;
      if (!endedGesture) return;
      if (endedGesture.trace){
        const { trace } = endedGesture;
        if (e.type === "pointerup" && endedGesture.moved){
          sampleTrace(trace, e, true);
          if (trace.points.length > 1) addRoutePoints(trace.team, trace.points);
        }
        queueDraw();
        return;
      }
      if (e.type !== "pointerup"){
        if (endedGesture.circle && endedGesture.moved){
          Object.assign(endedGesture.circle, endedGesture.original);
          queueDraw();
        }
        return;
      }

      if (endedGesture.moved){
        if (endedGesture.circle) saveMapState();
        return;
      }
      if (panMode) return;

      const pL = clientToLogical(e);
      if (!insideMap(pL)) return;

      if (noteMode){
        const text = prompt("Enter note:");
        if (!text) return;
        createNote(pL.x, pL.y, text, null, true);
        setMode(routeMode);
        saveMapState();
        return;
      }

      if (drawCircleMode){
        circles.push({ x: pL.x, y: pL.y, r: 30, color: "#00ffff" });
        historyStack.push({ type:"circle" });
        queueDraw();
        saveMapState();
        return;
      }

      if (!traceMode && activeTeam) addRoutePoints(activeTeam, [pL]);
    }
    for (const event of ["pointerup", "pointercancel", "lostpointercapture"]){
      map.addEventListener(event, e => {
        endPointer(e);
        applyLatestRemote();
      });
    }

    /***********************
     * Buttons: undo/reset/export/import
     ***********************/
    document.getElementById("undo-btn").onclick = () => {
      const last = historyStack.pop();
      if (!last) return;

      if (last.type === "circle"){
        circles.pop();
      } else if (last.type === "line"){
        const path = teamPaths[last.team];
        if (path){
          path.splice(-last.count);
          if (path.length === 0){
            delete teamPaths[last.team];
            teamIcons[last.team]?.remove();
            delete teamIcons[last.team];
          }
        }
      } else if (last.type === "note"){
        const el = map.querySelector(`.note[data-note-id="${CSS.escape(last.id)}"]`);
        if (el) el.remove();
        const idx = notesData.findIndex(n => n.id === last.id);
        if (idx !== -1) notesData.splice(idx, 1);
      }

      queueDraw();
      saveMapState();
    };

    function clearPlot(){
      gesture = null;
      Object.values(teamIcons).forEach(el => el.remove());
      Object.keys(teamIcons).forEach(id => delete teamIcons[id]);
      Object.keys(teamPaths).forEach(id => delete teamPaths[id]);
      circles.length = 0;
      map.querySelectorAll(".note").forEach(note => note.remove());
      notesData.length = 0;
      historyStack.length = 0;
      activeTeam = null;
      setSelection(null);
    }

    document.getElementById("reset-all-btn").onclick = () => {
      if (!confirm("Reset all?")) return;
      clearPlot();
      queueDraw();
      saveMapState();
    };

    function getPlot(){
      return { map:mapSelect.value, paths:teamPaths, circles, notes:notesData };
    }

    document.getElementById("export-btn").onclick = () => {
      const data = getPlot();
      const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "team-paths.json";
      a.click();
      URL.revokeObjectURL(url);
    };

    const isPoint = (point) => Number.isFinite(point?.x) && Number.isFinite(point?.y);
    const isMap = (value) => Array.from(mapSelect.options).some(option => option.value === value);
    const isCircle = (circle) => isPoint(circle) && Number.isFinite(circle.r) && circle.r > 0;
    const isObject = (value) => value && typeof value === "object" && !Array.isArray(value);

    function isPlot(plot){
      return isObject(plot) &&
        ["map", "paths", "circles", "notes"].some(key => Object.hasOwn(plot, key)) &&
        (plot.map === undefined || isMap(plot.map)) &&
        (plot.paths === undefined || (isObject(plot.paths) && Object.entries(plot.paths).every(([id, path]) =>
          /^team[1-9][0-9]*$/.test(id) && Array.isArray(path) && path.every(isPoint)))) &&
        (plot.circles === undefined || (Array.isArray(plot.circles) && plot.circles.every(isCircle))) &&
        (plot.notes === undefined || (Array.isArray(plot.notes) && plot.notes.every(isPoint)));
    }

    document.getElementById("import-file").onchange = async function(){
      const file = this.files[0];
      this.value = "";
      if (!file) return;

      let plot;
      try {
        plot = JSON.parse(await file.text());
        if (!isPlot(plot)) throw new Error("Invalid plot");
      } catch {
        plannerStatus.textContent = "Could not import this file. Choose a valid map planner JSON export.";
        return;
      }
      applyMapState(plot);
      plannerStatus.textContent = "Plot imported.";
      saveMapState();
    };

    mapSelect.addEventListener("change", () => {
      gesture = null;
      updateMapLabel();
      setMapBg();
      fitMap.click();
      queueDraw();
      saveMapState();
    });

    let realtimeEnabled = true;
    let realtimeChannel = null;
    let saveTimer = 0;
    let savePending = false;
    let saving = false;
    let lastRevision = 0;
    let latestRemote = null;

    async function loadMapState(){
      const { data, error } = await client
        .from("map")
        .select("state, updated_at")
        .eq("id", 1)
        .maybeSingle();

      if (error){
        plannerStatus.textContent = "Could not load the shared plot. Reload to try again.";
        return false;
      }
      if (data?.state){
        lastRevision = Date.parse(data.updated_at) || 0;
        applyMapState(data.state);
      }
      return true;
    }

    function saveMapState(delay = 0){
      if (!realtimeEnabled) return;
      savePending = true;
      clearTimeout(saveTimer);
      saveTimer = 0;
      if (delay){
        saveTimer = setTimeout(() => {
          saveTimer = 0;
          publishPlot();
        }, delay);
      } else {
        publishPlot();
      }
    }

    async function publishPlot(){
      if (saving || saveTimer || !realtimeEnabled || !savePending) return;
      saving = true;
      try {
        while (realtimeEnabled && savePending && !saveTimer){
          savePending = false;
          const revision = Math.max(Date.now(), lastRevision + 1, (latestRemote?.revision || 0) + 1);
          lastRevision = revision;
          const { error } = await client.from("map").upsert({
            id:1, state:structuredClone(getPlot()), updated_at:new Date(revision).toISOString()
          });
          if (error){
            plannerStatus.textContent = "Could not sync the plot. Your edits are still on this device.";
          } else if (plannerStatus.textContent.startsWith("Could not sync")){
            plannerStatus.textContent = "";
          }
        }
      } catch {
        plannerStatus.textContent = "Could not sync the plot. Your edits are still on this device.";
      } finally {
        saving = false;
        applyLatestRemote();
      }
    }

    function applyMapState(state){
      if (isMap(state?.map) && state.map !== mapSelect.value){
        mapSelect.value = state.map;
        updateMapLabel();
        setMapBg();
        fitMap.click();
      }

      clearPlot();

      for (const [id, points] of Object.entries(state?.paths || {})){
        if (!/^team[1-9][0-9]*$/.test(id) || !Array.isArray(points)) continue;
        const path = points.filter(isPoint).map(p => ({
          x:p.x, y:p.y, ...(p.trace === true ? { trace:true } : {}),
          ...(p.breakBefore === true ? { breakBefore:true } : {})
        }));
        if (!path.length) continue;
        teamPaths[id] = path;
        const icon = teamChoices.get(id);
        if (icon) teamIcons[id] = createUnit(icon, id, path[0].x, path[0].y);
      }

      for (const circle of Array.isArray(state?.circles) ? state.circles : []){
        if (isCircle(circle)) circles.push({ x:circle.x, y:circle.y, r:circle.r, color:circle.color || "#00ffff" });
      }
      for (const note of Array.isArray(state?.notes) ? state.notes : []){
        if (!isPoint(note)) continue;
        const id = typeof note.id === "string" && !notesData.some(existing => existing.id === note.id) ? note.id : null;
        createNote(note.x, note.y, typeof note.text === "string" ? note.text : "", id, false);
      }
      queueDraw();
    }

    function applyLatestRemote(){
      if (!realtimeEnabled || !latestRemote || saving || savePending || pointers.size) return;
      const { state, revision } = latestRemote;
      latestRemote = null;
      if (revision <= lastRevision) return;
      lastRevision = revision;
      applyMapState(state || {});
    }

    function handleMapChange(payload){
      const row = payload.new;
      const revision = Date.parse(row?.updated_at);
      if (!realtimeEnabled || Number(row?.id) !== 1 || !(revision > lastRevision)) return;
      if (!latestRemote || revision > latestRemote.revision) latestRemote = { state:row.state, revision };
      applyLatestRemote();
    }

    function enableRealtime(){
      if (realtimeChannel) return;
      realtimeChannel = client
        .channel("public:map")
        .on("postgres_changes", { event:"INSERT", schema:"public", table:"map" }, handleMapChange)
        .on("postgres_changes", { event:"UPDATE", schema:"public", table:"map" }, handleMapChange)
        .subscribe(status => {
          if (realtimeEnabled && (status === "CHANNEL_ERROR" || status === "TIMED_OUT")){
            plannerStatus.textContent = "Live updates are unavailable. The planner can still save edits.";
          } else if (status === "SUBSCRIBED" && plannerStatus.textContent.startsWith("Live updates")){
            plannerStatus.textContent = "";
          }
        });
    }

    const realtimeBtn = document.getElementById("realtime-toggle-btn");
    function updateRealtimeButton(){
      realtimeBtn.textContent = realtimeEnabled ? "Real-time: ON" : "Real-time: OFF";
      realtimeBtn.classList.toggle("active", realtimeEnabled);
      realtimeBtn.setAttribute("aria-pressed", String(realtimeEnabled));
    }

    realtimeBtn.onclick = async () => {
      realtimeEnabled = !realtimeEnabled;
      updateRealtimeButton();

      if (realtimeEnabled){
        enableRealtime();
        saveMapState();
      } else {
        clearTimeout(saveTimer);
        saveTimer = 0;
        savePending = false;
        latestRemote = null;
        const channel = realtimeChannel;
        realtimeChannel = null;
        if (channel){
          realtimeBtn.disabled = true;
          try {
            await client.removeChannel(channel);
          } finally {
            realtimeBtn.disabled = false;
          }
        }
      }
    };

    updateMapLabel();
    setMapBg();
    updateView();
    updateRealtimeButton();

    window.addEventListener("DOMContentLoaded", async () => {
      const session = await ensureSession();
      if (!session) return;

      loadLogoUploadAccess().catch(error => console.error("Could not check logo upload access:", error));
      document.getElementById("user-info").textContent =
        "Logged in as " + (session.user?.email || "unknown");
      await loadTeamIcons();
      const loaded = await loadMapState();
      if (loaded){
        enableRealtime();
      } else {
        realtimeEnabled = false;
        updateRealtimeButton();
      }
      document.getElementById("sidebar").inert = false;
      map.inert = false;
      mapSelect.disabled = false;
    });
  </script>
  <script src="assets/js/global-search-index.js" defer></script>
  <script src="assets/js/global-site-search.js" defer></script>
</body>
</html>
